<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="robots" content="noindex" />
  <title>アイディアメモ</title>
  <style>
    :root{
      --bg1:#0b1020; --bg2:#121a33;
      --text: rgba(255,255,255,.92); --muted: rgba(255,255,255,.66);
      --line: rgba(255,255,255,.14); --panel: rgba(255,255,255,.06);
      --accent1: rgba(124,92,255,.95); --accent2: rgba(36,211,238,.85);
      --warn: rgba(255,196,84,.95); --bad: rgba(255,110,110,.95);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 500px at 20% -10%, rgba(124,92,255,.35), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(36,211,238,.25), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      min-height:100vh;
    }
    button, input, textarea{font-family:inherit;color:inherit}
    button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
    .wrap{max-width:760px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom));}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;}
    .title{display:flex;gap:10px;align-items:center;min-width:0}
    .logo{width:38px;height:38px;border-radius:12px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:grid;place-items:center;font-size:20px}
    h1{font-size:15px;margin:0;letter-spacing:.02em;line-height:1.3}
    .status{flex:0 1 auto;max-width:58%;font-size:12px;color:var(--muted);padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status.warn{color:var(--warn);border-color:rgba(255,196,84,.5)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
    .tab{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 2px;font-size:14px;font-weight:700;min-height:48px}
    .tab.on{background:linear-gradient(135deg, rgba(124,92,255,.6), rgba(36,211,238,.42));border-color:rgba(255,255,255,.4)}
    .panel{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:12px;margin-bottom:10px}
    [hidden]{display:none !important}
    .label{font-size:12px;color:var(--muted);margin:10px 0 5px}
    .label:first-child{margin-top:0}
    .field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.28);padding:10px;font-size:16px}
    textarea.field{resize:vertical;line-height:1.6}
    input[type=date],input[type=time]{color-scheme:dark}
    .row2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
    .mic{
      width:100%;min-height:76px;border-radius:14px;border:1px solid rgba(255,255,255,.3);
      font-size:18px;font-weight:800;margin-top:10px;
      background:linear-gradient(135deg, rgba(124,92,255,.85), rgba(36,211,238,.65));
    }
    .mic.rec{background:linear-gradient(135deg, rgba(255,80,80,.9), rgba(255,150,80,.8));animation:pulse 1.2s infinite}
    @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,90,90,.18)}}
    .interim{min-height:20px;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
    .go{width:100%;border:1px solid rgba(255,255,255,.3);border-radius:10px;min-height:52px;font-size:16px;font-weight:700;margin-top:12px;background:linear-gradient(135deg, rgba(124,92,255,.85), rgba(36,211,238,.65))}
    .go:disabled{opacity:.45}
    .btn{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:10px;min-height:44px;padding:8px 12px;font-size:14px;font-weight:600}
    .btn.on{background:rgba(124,92,255,.5);border-color:rgba(255,255,255,.4)}
    .btn.danger{color:var(--bad);border-color:rgba(255,110,110,.4)}
    .btns{display:flex;flex-wrap:wrap;gap:6px}
    .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
    .card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;margin-bottom:8px}
    .card .open{cursor:pointer}
    .card.fav{border-color:rgba(255,205,90,.65);background:rgba(255,205,90,.07)}
    .card.drop{opacity:.6}
    .cardBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
    .cardBtns .btn{min-height:40px;padding:6px 4px;font-size:13px}
    .btn.favOn{background:rgba(255,205,90,.28);border-color:rgba(255,205,90,.7)}
    .card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
    .card .txt{font-size:15px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
    .card .lead{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
    .badge.ai{background:rgba(36,211,238,.2);border-color:rgba(36,211,238,.5)}
    .badge.wait{background:rgba(255,196,84,.16);border-color:rgba(255,196,84,.5);color:var(--warn)}
    .badge.stop{opacity:.7}
    .badge.voice{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.6)}
    .badge.unsent{background:rgba(255,110,110,.16);border-color:rgba(255,110,110,.5);color:var(--bad)}
    .memoBody{font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
    .memoRaw{font-size:13px;color:var(--muted);margin-top:8px}
    .memoRaw summary{cursor:pointer;min-height:32px}
    .memoComment{font-size:14px;color:var(--muted);line-height:1.6;white-space:pre-wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
    details.round{border:1px solid var(--line);background:var(--panel);border-radius:14px;margin-bottom:8px;overflow:hidden}
    details.round summary{list-style:none;padding:12px;cursor:pointer;min-height:48px}
    details.round summary::-webkit-details-marker{display:none}
    .rhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
    .rtitle{font-size:15px;font-weight:700;line-height:1.5}
    .rbody{padding:0 12px 12px;font-size:15px;line-height:1.75;word-break:break-word}
    .rbody h3{font-size:15px;margin:14px 0 4px;color:rgba(160,225,255,.95)}
    .rbody p{margin:6px 0}
    .rbody ul,.rbody ol{margin:6px 0;padding-left:22px}
    .rbody a{color:rgba(130,220,255,.95);word-break:break-all}
    .rsum{background:rgba(124,92,255,.14);border-radius:10px;padding:9px 11px;margin-bottom:8px}
    .src{font-size:13px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
    .src div{margin:4px 0}
    .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 8px;line-height:1.8}
    .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,27,51,.96);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:14px;max-width:88vw;z-index:9}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><div class="logo">💡</div><h1>アイディアメモ</h1></div>
    <button class="status" id="status" title="押すと最新にします">準備中</button>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="new">メモする</button>
    <button class="tab" data-tab="list">一覧</button>
    <button class="tab" data-tab="set">設定</button>
  </div>

  <!-- メモする -->
  <section id="p-new">
    <div class="panel">
      <div class="label">日付</div>
      <div class="row2">
        <input class="field" type="date" id="fDate" />
        <input class="field" type="time" id="fTime" />
      </div>
      <button class="mic" id="mic">🎤 話してメモする</button>
      <div class="interim" id="interim"></div>
      <div id="recBox" hidden>
        <audio id="recPlay" controls style="width:100%;margin-top:6px"></audio>
        <div class="btns" style="margin-top:6px"><button class="btn" id="recRedo">録り直す</button><button class="btn danger" id="recDrop">録音を消す</button></div>
      </div>
      <div class="label">メモ（書いて足したいときだけ）</div>
      <textarea class="field" id="fText" rows="3" placeholder="録音だけでも保存できます"></textarea>
      <div class="label">コメント（任意）</div>
      <textarea class="field" id="fComment" rows="2" placeholder="きっかけ・狙い・調べてほしい方向など"></textarea>
      <button class="go" id="save">保存する</button>
      <div class="hint" id="newHint">録音は保存後10分以内にPCのAIが文字に直し、世の中の情報を調べて膨らませます。その後も1日2回、切り口を変えて膨らませます（5回まで）。</div>
    </div>
  </section>

  <!-- 一覧 -->
  <section id="p-list" hidden>
    <div id="listView">
      <div class="panel">
        <input class="field" id="q" placeholder="メモ・派生案を検索" />
        <div class="btns" style="margin-top:8px" id="filters">
          <button class="btn on" data-f="all">すべて</button>
          <button class="btn" data-f="fav">★ お気に入り</button>
          <button class="btn" data-f="stopped">検討中止</button>
        </div>
      </div>
      <div id="cards"></div>
    </div>
    <div id="detailView" hidden></div>
  </section>

  <!-- 設定 -->
  <section id="p-set" hidden>
    <div class="panel">
      <div class="label">メモの保存先（GitHubの非公開リポジトリ）</div>
      <div class="row2">
        <input class="field" id="cOwner" placeholder="持ち主" autocapitalize="off" autocomplete="off" />
        <input class="field" id="cRepo" placeholder="リポジトリ名" autocapitalize="off" autocomplete="off" />
      </div>
      <div class="label">アクセストークン</div>
      <input class="field" id="cToken" type="password" placeholder="github_pat_…" autocapitalize="off" autocomplete="off" />
      <button class="go" id="cSave">保存して接続を確かめる</button>
      <div class="hint" id="cHint">トークンはこの端末の中だけに保存します。端末ごとに1回入力します。</div>
    </div>
    <div class="panel">
      <div class="label">合言葉（他の端末への引き継ぎ）</div>
      <input class="field" id="cPass" type="password" placeholder="12文字以上" autocapitalize="off" autocomplete="off" />
      <button class="go" id="cPassBtn">合言葉で設定を復元する</button>
      <div class="hint" id="pHint"></div>
    </div>
    <div class="panel">
      <div class="label">この端末に残っているもの</div>
      <div class="hint" id="devInfo" style="margin-top:0"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
var DEFAULT_OWNER = "HIROTA-KAZUHISA", DEFAULT_REPO = "idea-memo-data", BRANCH = "main", MAX_ROUNDS = 5;
var TOKEN_RE = /^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/;
var cfg = LS.get("im_cfg", {owner: DEFAULT_OWNER, repo: DEFAULT_REPO, token: ""});
if (cfg.token && !TOKEN_RE.test(cfg.token)){ cfg.token = ""; LS.set("im_cfg", cfg); }   // 間違って入れた文字は捨てる
var cache = LS.get("im_cache", {memos:{}, expands:{}, texts:{}, shas:{}});
if (!cache.texts) cache.texts = {};   // 最後に取得した内容
var outbox = LS.get("im_outbox", {});                               // 未送信のメモ {id: memo}
var filter = "all", openId = null, busy = false, audioMem = {};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
var toastT;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 3200); }
function setStatus(msg, warn){ var s = $("status"); s.textContent = msg; s.classList.toggle("warn", !!warn); }

/* ---------- GitHub ---------- */
function b64enc(str){ var b = new TextEncoder().encode(str), s = ""; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function b64dec(b64){ var s = atob(b64.replace(/\s/g, "")), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); }
function api(path, opt){
  opt = opt || {};
  var h = {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + cfg.token, "X-GitHub-Api-Version": "2022-11-28"};
  return fetch("https://api.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo) + path,
    {method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: "no-store"})
    .then(function(r){
      if (r.status === 204) return null;
      return r.json().catch(function(){ return null; }).then(function(j){
        if (!r.ok){ var e = new Error((j && j.message) || ("HTTP " + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
}
function putFile(path, obj, sha, message){
  var body = {message: message, content: b64enc(JSON.stringify(obj, null, 2) + "\n"), branch: BRANCH};
  if (sha) body.sha = sha;
  return api("/contents/" + path, {method: "PUT", body: body});
}
function memoPath(id){ return "memos/" + id + ".json"; }
function expPath(id){ return "expand/" + id + ".json"; }

function flushOutbox(){
  var ids = Object.keys(outbox);
  var p = Promise.resolve();
  ids.forEach(function(id){
    p = p.then(function(){
      var m = outbox[id];
      function send(sha){ return putFile(memoPath(id), m, sha, "メモ " + id); }
      var au = audioMem[id] || LS.get("im_au_" + id, null), pre = Promise.resolve();
      if (au && m.audio) pre = api("/contents/" + m.audio, {method: "PUT", body: {message: "録音 " + id, content: au, branch: BRANCH}})
        .catch(function(e){ if (e.status !== 422 && e.status !== 409) throw e; })      // 既に届いていればよい
        .then(function(){ delete audioMem[id]; LS.del("im_au_" + id); });
      return pre.then(function(){ return send(cache.shas[memoPath(id)]); }).catch(function(e){
        if (e.status === 409 || e.status === 422){   // 手元の版が古い → 取り直して送り直す
          return api("/contents/" + memoPath(id) + "?ref=" + BRANCH).then(function(f){ return send(f.sha); },
            function(e2){ if (e2.status === 404) return send(null); throw e2; });
        }
        throw e;
      }).then(function(res){
        cache.memos[id] = m;
        if (res && res.content) cache.shas[memoPath(id)] = res.content.sha;
        delete outbox[id];
        LS.set("im_outbox", outbox); LS.set("im_cache", cache);
      });
    });
  });
  return p;
}
function pull(){
  return api("/git/trees/" + BRANCH + "?recursive=1").then(function(t){
    var files = (t.tree || []).filter(function(e){ return e.type === "blob" && /^(memos|expand|text)\/[^\/]+\.json$/.test(e.path); });
    var memos = {}, expands = {}, texts = {}, shas = {}, jobs = [];
    (t.tree || []).forEach(function(e){ if (e.type === "blob" && e.path.indexOf("audio/") === 0) shas[e.path] = e.sha; });
    files.forEach(function(f){
      var id = f.path.replace(/^.*\//, "").replace(/\.json$/, ""), dir = f.path.split("/")[0];
      var store = dir === "memos" ? memos : dir === "expand" ? expands : texts;
      var old = dir === "memos" ? cache.memos : dir === "expand" ? cache.expands : cache.texts;
      shas[f.path] = f.sha;
      if (cache.shas[f.path] === f.sha && old[id]) { store[id] = old[id]; return; }
      jobs.push(api("/git/blobs/" + f.sha).then(function(b){
        try { store[id] = JSON.parse(b64dec(b.content)); } catch(e){ /* 壊れたファイルは飛ばす */ }
      }));
    });
    return Promise.all(jobs).then(function(){
      cache = {memos: memos, expands: expands, texts: texts, shas: shas};
      LS.set("im_cache", cache);
    });
  });
}
function sync(quiet){
  if (!cfg.token){ setStatus("設定がまだです", true); render(); return Promise.resolve(); }
  if (busy) return Promise.resolve();
  busy = true; if (!quiet) setStatus("更新中…");
  return flushOutbox().then(pull).then(function(){
    var d = new Date(); setStatus("最新 " + pad(d.getHours()) + ":" + pad(d.getMinutes()));
  }).catch(function(e){
    var n = Object.keys(outbox).length;
    if (e.status === 401 || e.status === 403) setStatus("トークンを確認してください", true);
    else if (e.status === 404) setStatus("保存先が見つかりません", true);
    else setStatus(n ? "未送信 " + n + "件（電波待ち）" : "つながりません", true);
  }).then(function(){ busy = false; render(); });
}

/* ---------- データ ---------- */
function groupOf(m){ return m.status === "stopped" ? 2 : m.fav ? 0 : 1; }
function allMemos(){
  var m = {}; Object.keys(cache.memos).forEach(function(k){ m[k] = cache.memos[k]; });
  Object.keys(outbox).forEach(function(k){ m[k] = outbox[k]; });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){
    var ga = groupOf(a), gb = groupOf(b);          // お気に入り → その他 → 検討中止
    if (ga !== gb) return ga - gb;
    return ((b.date || "") + (b.time || "") + b.id).localeCompare((a.date || "") + (a.time || "") + a.id);
  });
}
function textOf(id){ return cache.texts[id] || null; }
function bodyOf(m){
  var t = textOf(m.id), parts = [m.text || "", (t && t.text) || ""].filter(function(x){ return x.trim(); });
  if (parts.length) return parts.join("\n\n");
  if (m.audio) return t && t.failed ? "（録音を聞き取れませんでした）" : "（録音メモ：文字に直しています）";
  return "";
}
function voiceWait(m){ return !!m.audio && !textOf(m.id); }
function roundsOf(id){ var e = cache.expands[id]; return (e && e.rounds) || []; }
function stateOf(m){
  var e = cache.expands[m.id], n = roundsOf(m.id).length;
  var morePending = (m.more || 0) > ((e && e.moreDone) || 0);
  if (outbox[m.id] && !cache.memos[m.id]) return {cls: "unsent", label: "未送信"};
  if (m.status === "stopped") return {cls: "stop", label: "検討中止 " + n + "回"};
  if (voiceWait(m)) return {cls: "voice", label: "文字起こし待ち"};
  if (m.audio && textOf(m.id).failed && !(m.text || "").trim()) return {cls: "unsent", label: "聞き取れず"};
  if (n === 0) return {cls: "wait", label: "AI待ち"};
  if (morePending) return {cls: "wait", label: n + "回＋依頼中"};
  if (n >= MAX_ROUNDS) return {cls: "ai", label: n + "回（上限）"};
  return {cls: "ai", label: "膨らまし " + n + "回"};
}
function saveMemo(m){
  m.updatedAt = new Date().toISOString();
  outbox[m.id] = m; LS.set("im_outbox", outbox);
  render();
  return sync(true);
}

/* ---------- 表示 ---------- */
function md(src){
  var out = [], list = null;
  function inline(s){
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s;
  }
  function close(){ if (list){ out.push("</" + list + ">"); list = null; } }
  String(src || "").split(/\r?\n/).forEach(function(line){
    var m;
    if ((m = line.match(/^#{1,4}\s+(.*)$/))){ close(); out.push("<h3>" + inline(m[1]) + "</h3>"); }
    else if ((m = line.match(/^\s*[-・*]\s+(.*)$/))){ if (list !== "ul"){ close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+[.)．]\s*(.*)$/))){ if (list !== "ol"){ close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else if (!line.trim()){ close(); }
    else { close(); out.push("<p>" + inline(line) + "</p>"); }
  });
  close(); return out.join("");
}
function plain(src){ return String(src || "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/[#*`>]/g, "").replace(/^\s*[-・]\s*/gm, ""); }
function fmtDate(m){ return (m.date || "").replace(/-/g, "/") + (m.time ? " " + m.time : ""); }
function fmtAt(iso){ var d = new Date(iso); if (isNaN(d)) return ""; return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }

function renderList(){
  var q = $("q").value.trim().toLowerCase();
  var items = allMemos().filter(function(m){
    if (filter === "fav" && groupOf(m) !== 0) return false;
    if (filter === "stopped" && m.status !== "stopped") return false;
    if (!q) return true;
    var hay = [bodyOf(m), m.comment, m.date].concat(roundsOf(m.id).map(function(r){ return [r.title, r.summary, r.body, r.angle].join(" "); })).join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  if (!items.length){
    $("cards").innerHTML = '<div class="empty">' + (cfg.token ? (q || filter !== "all" ? "当てはまるメモがありません" : "まだメモがありません。<br>「メモする」から話してみてください。") : "「設定」で保存先とトークンを入れると使えます。") + "</div>";
    return;
  }
  $("cards").innerHTML = items.map(function(m){
    var st = stateOf(m), rs = roundsOf(m.id), last = rs[rs.length - 1];
    var g = groupOf(m);
    return '<div class="card' + (g === 0 ? " fav" : g === 2 ? " drop" : "") + '" data-id="' + esc(m.id) + '"><div class="open" role="button" tabindex="0">' +
      '<div class="meta"><span>' + (g === 0 ? "★ " : "") + esc(fmtDate(m)) + '</span><span class="badge ' + st.cls + '">' + esc(st.label) + "</span></div>" +
      '<div class="txt">' + esc(bodyOf(m)) + "</div>" +
      (last ? '<div class="lead">→ ' + esc(last.title || last.summary || "") + "</div>" : "") + "</div>" +
      '<div class="cardBtns">' +
        '<button class="btn' + (g === 0 ? " favOn" : "") + '" data-cact="fav">' + (g === 0 ? "★ 外す" : "☆ お気に入り") + "</button>" +
        '<button class="btn' + (g === 2 ? " on" : "") + '" data-cact="drop">' + (g === 2 ? "検討を再開" : "検討中止") + "</button>" +
        '<button class="btn danger" data-cact="del">削除</button>' +
      "</div></div>";
  }).join("");
}
function renderDetail(){
  var m = allMemos().filter(function(x){ return x.id === openId; })[0];
  if (!m){ openId = null; $("detailView").hidden = true; $("listView").hidden = false; renderList(); return; }
  var st = stateOf(m), rs = roundsOf(m.id).slice().reverse(), stopped = m.status === "stopped";
  var e = cache.expands[m.id], morePending = (m.more || 0) > ((e && e.moreDone) || 0);
  var h = '<div class="btns" style="margin-bottom:8px"><button class="btn" data-act="back">← 一覧へ</button></div>' +
    '<div class="panel"><div class="card" style="border:0;padding:0;margin:0;background:none"><div class="meta"><span>' + esc(fmtDate(m)) + '</span><span class="badge ' + st.cls + '">' + esc(st.label) + "</span></div></div>" +
    '<div class="memoBody">' + esc(bodyOf(m)) + "</div>" +
    ((textOf(m.id) && textOf(m.id).raw && textOf(m.id).raw !== textOf(m.id).text) ? '<details class="memoRaw"><summary>整える前の聞き取り</summary>' + esc(textOf(m.id).raw) + "</details>" : "") +
    (m.comment ? '<div class="memoComment">' + esc(m.comment) + "</div>" : "") +
    '<div class="btns" style="margin-top:12px">' +
      '<button class="btn" data-act="more"' + (morePending || stopped ? " disabled style=\"opacity:.5\"" : "") + ">" + (morePending ? "依頼済み（次の確認で実行）" : "もっと膨らます") + "</button>" +
      '<button class="btn' + (groupOf(m) === 0 ? " favOn" : "") + '" data-act="fav">' + (groupOf(m) === 0 ? "★ 外す" : "☆ お気に入り") + "</button>" +
      '<button class="btn" data-act="toggle">' + (stopped ? "検討を再開" : "検討中止") + "</button>" +
      '<button class="btn" data-act="comment">コメントを直す</button>' +
      '<button class="btn danger" data-act="del">削除</button>' +
    "</div></div>";
  if (!rs.length) h += '<div class="empty">まだ膨らませていません。<br>PCのClaudeが10分ごとに新しいメモを確認します。</div>';
  rs.forEach(function(r, i){
    h += '<details class="round"' + (i === 0 ? " open" : "") + '><summary><div class="rhead"><span class="badge ai">' + esc(r.n) + "回目</span>" +
      (r.angle ? '<span class="badge">' + esc(r.angle) + "</span>" : "") + "<span>" + esc(fmtAt(r.at)) + "</span></div>" +
      '<div class="rtitle">' + esc(r.title || "") + "</div></summary><div class=\"rbody\">" +
      (r.summary ? '<div class="rsum">' + esc(r.summary) + "</div>" : "") + md(r.body) +
      ((r.internal && r.internal.length) ? '<div class="src"><strong>社内の情報</strong>' + r.internal.map(function(x){ return "<div>・" + esc(x.from || "") + (x.note ? "：" + esc(x.note) : "") + "</div>"; }).join("") + "</div>" : "") +
      ((r.sources && r.sources.length) ? '<div class="src"><strong>調べた先</strong>' + r.sources.map(function(x){
        var ok = /^https?:\/\//.test(x.url || "");
        return "<div>・" + (ok ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.title || x.url) + "</a>" : esc(x.title || "")) + "</div>"; }).join("") + "</div>" : "") +
      '<div class="btns" style="margin-top:10px"><button class="btn" data-act="speak" data-n="' + esc(r.n) + '">🔊 読み上げ</button></div>' +
      "</div></details>";
  });
  $("detailView").innerHTML = h;
}
function render(){
  if (openId){ $("listView").hidden = true; $("detailView").hidden = false; renderDetail(); }
  else { $("detailView").hidden = true; $("listView").hidden = false; renderList(); }
  var n = Object.keys(outbox).length;
  $("devInfo").textContent = "メモ " + Object.keys(cache.memos).length + "件の写し、未送信 " + n + "件。";
  $("newHint").hidden = !cfg.token;
}

/* ---------- 画面の切り替え ---------- */
function showTab(name){
  ["new", "list", "set"].forEach(function(t){ $("p-" + t).hidden = t !== name; });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){ b.classList.toggle("on", b.dataset.tab === name); });
  if (name === "list"){ render(); sync(true); }
}
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){ b.onclick = function(){ openId = null; showTab(b.dataset.tab); }; });
$("status").onclick = function(){ sync(); };
$("filters").onclick = function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  Array.prototype.forEach.call($("filters").children, function(x){ x.classList.toggle("on", x === b); });
  renderList();
};
$("q").oninput = renderList;
function setFav(m){ m.fav = !(m.fav && m.status !== "stopped"); m.status = "active"; saveMemo(m); }       // お気に入りにすると検討中止は外れる
function setDrop(m){ if (m.status === "stopped") m.status = "active"; else { m.status = "stopped"; m.fav = false; } saveMemo(m); }
function askDelete(id){
  if (!confirm("このメモと派生案を削除します。元に戻せません。よろしいですか？")) return;
  removeMemo(id);
}
$("cards").onclick = function(ev){
  var c = ev.target.closest(".card"); if (!c) return;
  var b = ev.target.closest("button[data-cact]");
  if (!b){ if (ev.target.closest(".open")){ openId = c.dataset.id; render(); window.scrollTo(0, 0); } return; }
  var m = allMemos().filter(function(x){ return x.id === c.dataset.id; })[0]; if (!m) return;
  m = JSON.parse(JSON.stringify(m));
  if (b.dataset.cact === "fav") setFav(m);
  else if (b.dataset.cact === "drop") setDrop(m);
  else if (b.dataset.cact === "del") askDelete(m.id);
};
$("detailView").onclick = function(ev){
  var b = ev.target.closest("button[data-act]"); if (!b) return;
  var act = b.dataset.act, m = allMemos().filter(function(x){ return x.id === openId; })[0];
  if (act === "back"){ speechStop(); openId = null; render(); return; }
  if (!m) return;
  m = JSON.parse(JSON.stringify(m));
  if (act === "more"){ m.more = (m.more || 0) + 1; saveMemo(m); toast("依頼しました。次の確認（10分以内）で膨らませます"); }
  else if (act === "toggle"){ setDrop(m); }
  else if (act === "fav"){ setFav(m); }
  else if (act === "comment"){
    var v = prompt("コメント", m.comment || ""); if (v == null) return;
    m.comment = v.trim(); saveMemo(m);
  }
  else if (act === "del"){
    if (!confirm("このメモと派生案を削除します。元に戻せません。よろしいですか？")) return;
    removeMemo(m.id);
  }
  else if (act === "speak"){
    var r = roundsOf(m.id).filter(function(x){ return String(x.n) === b.dataset.n; })[0];
    if (r) speak((r.title || "") + "。" + (r.summary || "") + "。" + plain(r.body), b);
  }
};
function removeMemo(id){
  var wasLocalOnly = !cache.memos[id];
  delete outbox[id]; LS.set("im_outbox", outbox); delete audioMem[id]; LS.del("im_au_" + id);
  openId = null;
  if (wasLocalOnly){ render(); return; }
  setStatus("削除中…");
  var mm = cache.memos[id] || {};
  var shas = {}, paths = [memoPath(id), expPath(id), "text/" + id + ".json", mm.audio || ""].filter(function(p){ shas[p] = cache.shas[p]; return shas[p]; });
  delete cache.memos[id]; delete cache.expands[id]; delete cache.texts[id];      // 一覧からはすぐ消す（失敗したら次の更新で戻る）
  paths.forEach(function(p){ delete cache.shas[p]; });
  LS.set("im_cache", cache); render();
  paths.reduce(function(p, path){ return p.then(function(){
    return api("/contents/" + path, {method: "DELETE", body: {message: "削除 " + id, sha: shas[path], branch: BRANCH}});
  }); }, Promise.resolve())
    .then(function(){ toast("削除しました"); }, function(){ toast("削除できませんでした"); })
    .then(function(){ return sync(true); });
}

/* ---------- 読み上げ ---------- */
var speaking = null;
function speechStop(){ if (window.speechSynthesis) speechSynthesis.cancel(); if (speaking){ speaking.textContent = "🔊 読み上げ"; speaking = null; } }
function speak(text, btn){
  if (!window.speechSynthesis){ toast("この端末は読み上げに対応していません"); return; }
  if (speaking === btn){ speechStop(); return; }
  speechStop();
  var u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 1.1;
  u.onend = u.onerror = function(){ if (speaking === btn){ btn.textContent = "🔊 読み上げ"; speaking = null; } };
  speaking = btn; btn.textContent = "■ 止める"; speechSynthesis.speak(u);
}

/* ---------- 録音 ---------- */
var REC_MAX_SEC = 300, recOn = false, mediaRec = null, recChunks = [], recTimer = null, recStart = 0;
var recBlob = null, recSec = 0;      // 保存前の録音
function recMime(){
  var c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  for (var i = 0; i < c.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i];
  return "";
}
function showRec(){
  var has = !!recBlob;
  $("recBox").hidden = !has;
  if (has){ $("recPlay").src = URL.createObjectURL(recBlob); }
  else { $("recPlay").removeAttribute("src"); }
  $("mic").textContent = has ? "録音済み " + recSec + "秒（下で聞き直せます）" : "🎤 話してメモする";
  $("mic").disabled = has;
  $("mic").style.opacity = has ? ".6" : "";
}
function startRec(){
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast("この端末は録音に未対応です。メモ欄に書いてください"); return; }
  navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}}).then(function(stream){
    recChunks = [];
    var mime = recMime(), opt = {audioBitsPerSecond: 32000}; if (mime) opt.mimeType = mime;
    mediaRec = new MediaRecorder(stream, opt);
    mediaRec.ondataavailable = function(ev){ if (ev.data && ev.data.size) recChunks.push(ev.data); };
    mediaRec.onstop = function(){
      recSec = Math.max(1, Math.round((Date.now() - recStart) / 1000));
      recBlob = new Blob(recChunks, {type: mediaRec.mimeType || mime || "audio/webm"});
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(recTimer); recOn = false; $("mic").classList.remove("rec");
      if (recBlob.size < 800){ recBlob = null; toast("録音できていません。もう一度お試しください"); }
      showRec();
    };
    recStart = Date.now(); recOn = true; mediaRec.start(1000);
    $("mic").disabled = false; $("mic").style.opacity = "";
    $("mic").classList.add("rec");
    function tick(){
      var sec = Math.floor((Date.now() - recStart) / 1000);
      $("mic").textContent = "■ 録音中 " + Math.floor(sec / 60) + ":" + pad(sec % 60) + "（押すと止まる）";
      if (sec >= REC_MAX_SEC){ toast("5分になったので止めました"); stopRec(); }
    }
    tick(); recTimer = setInterval(tick, 500);
  }, function(){ toast("マイクの使用が許可されていません"); });
}
function stopRec(){
  if (!recOn) return;
  try{ if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop(); }catch(e){}
}
$("mic").onclick = function(){ if (recOn) stopRec(); else startRec(); };
$("recRedo").onclick = function(){ recBlob = null; showRec(); startRec(); };
$("recDrop").onclick = function(){ recBlob = null; showRec(); };
function blobB64(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(String(fr.result).replace(/^data:[^,]*,/, "")); };
    fr.onerror = rej; fr.readAsDataURL(blob);
  });
}

/* ---------- 新しいメモ ---------- */
function resetForm(){
  var d = new Date();
  $("fDate").value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  $("fTime").value = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("fText").value = ""; $("fComment").value = ""; LS.del("im_draft");
}
function keepDraft(){ LS.set("im_draft", {text: $("fText").value, comment: $("fComment").value}); }
$("fText").oninput = keepDraft; $("fComment").oninput = keepDraft;
$("save").onclick = function(){
  if (recOn){ toast("録音を止めてから保存してください"); return; }
  var text = $("fText").value.trim();
  if (!text && !recBlob){ toast("録音かメモのどちらかを入れてください"); return; }
  var d = new Date();
  var id = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  var m = {id: id, date: $("fDate").value, time: $("fTime").value, text: text, comment: $("fComment").value.trim(),
           status: "active", more: 0, createdAt: d.toISOString()};
  var blob = recBlob, sec = recSec;
  recBlob = null; showRec(); resetForm(); showTab("list");
  var ready = Promise.resolve();
  if (blob){
    m.audio = "audio/" + id + (/mp4/.test(blob.type) ? ".m4a" : ".webm"); m.audioSec = sec;
    ready = blobB64(blob).then(function(b64){ audioMem[id] = b64; try{ localStorage.setItem("im_au_" + id, JSON.stringify(b64)); }catch(e){} });
  }
  ready.then(function(){ return saveMemo(m); }).then(function(){ toast(outbox[id] ? "この端末に保存しました（つながったら送ります）" : "保存しました"); });
};

/* ---------- 設定 ---------- */
$("cOwner").value = cfg.owner || ""; $("cRepo").value = cfg.repo || "";
$("cToken").placeholder = cfg.token ? "入力済み（変えるときだけ入れる）" : "github_pat_…";
$("cSave").onclick = function(){
  var t = $("cToken").value.trim();
  if (t && !TOKEN_RE.test(t)){
    $("cHint").textContent = "これはトークンではありません。「github_pat_」で始まる長い文字列を貼ってください（ページのアドレスや名前ではありません）。";
    $("cToken").value = ""; return;
  }
  cfg = {owner: $("cOwner").value.trim() || DEFAULT_OWNER, repo: $("cRepo").value.trim() || DEFAULT_REPO, token: t || cfg.token || ""};
  LS.set("im_cfg", cfg); $("cToken").value = "";
  if (!cfg.token){ $("cHint").textContent = "トークンを入れてください。"; return; }
  $("cHint").textContent = "確かめています…";
  api("/git/trees/" + BRANCH).then(function(){
    $("cHint").textContent = "接続できました。"; $("cToken").placeholder = "入力済み（変えるときだけ入れる）"; passUi(); sync();
  }, function(e){
    $("cHint").textContent = "接続できませんでした（" + (e.status === 401 ? "トークンが違います" : e.status === 404 ? "保存先が見つからないか、トークンに権限がありません" : e.message) + "）";
  });
};

/* ---------- 合言葉での引き継ぎ ---------- */
var KEY_PATH = "config/key.json", PBKDF_ITER = 600000, PASS_MIN = 12;
function bytesB64(b){ var s = ""; b = new Uint8Array(b); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function b64Bytes(s){ var r = atob(s), b = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) b[i] = r.charCodeAt(i); return b; }
function passKey(pass, salt, iter){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
  });
}
function passUi(){
  $("cPassBtn").textContent = cfg.token ? "この合言葉で引き継ぎを登録する" : "合言葉で設定を復元する";
  if (!$("pHint").dataset.msg) $("pHint").textContent = cfg.token
    ? "合言葉を登録すると、他のPCやスマホでは合言葉を入れるだけで使えます。暗号化したトークンをページ側に置くので、推測されにくい12文字以上にしてください。"
    : "設定済みの端末で登録した合言葉を入れると、トークンを貼らずに使えます。";
}
function passMsg(t){ $("pHint").dataset.msg = "1"; $("pHint").textContent = t; }
$("cPassBtn").onclick = function(){
  var pass = $("cPass").value;
  if (!window.crypto || !crypto.subtle){ passMsg("このブラウザでは使えません。"); return; }
  if (pass.length < PASS_MIN){ passMsg("合言葉は" + PASS_MIN + "文字以上にしてください。"); return; }
  $("cPassBtn").disabled = true;
  var job;
  if (cfg.token){                                   // 登録：暗号化して保存先へ置く（PC側がページへ写す）
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    passMsg("登録しています…");
    job = passKey(pass, salt, PBKDF_ITER).then(function(k){
      return crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, k, new TextEncoder().encode(JSON.stringify({token: cfg.token, owner: cfg.owner, repo: cfg.repo})));
    }).then(function(ct){
      var blob = {v: 1, iter: PBKDF_ITER, salt: bytesB64(salt), iv: bytesB64(iv), ct: bytesB64(ct), at: new Date().toISOString()};
      return api("/contents/" + KEY_PATH + "?ref=" + BRANCH).then(function(f){ return f.sha; }, function(e){ if (e.status === 404) return null; throw e; })
        .then(function(sha){ return putFile(KEY_PATH, blob, sha, "引き継ぎ用の設定"); });
    }).then(function(){ $("cPass").value = ""; passMsg("登録しました。10分ほどで、他の端末から合言葉で使えるようになります。"); },
            function(e){ passMsg("登録できませんでした（" + e.message + "）"); });
  } else {                                          // 復元：ページ側の暗号化データを合言葉で開く
    passMsg("確かめています…");
    job = fetch("key.json?v=" + Date.now(), {cache: "no-store"}).then(function(r){
      if (!r.ok) throw new Error("nokey"); return r.json();
    }).then(function(b){
      return passKey(pass, b64Bytes(b.salt), b.iter).then(function(k){
        return crypto.subtle.decrypt({name: "AES-GCM", iv: b64Bytes(b.iv)}, k, b64Bytes(b.ct));
      }).then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); }, function(){ throw new Error("badpass"); });
    }).then(function(c){
      cfg = {owner: c.owner || DEFAULT_OWNER, repo: c.repo || DEFAULT_REPO, token: c.token};
      LS.set("im_cfg", cfg); $("cPass").value = "";
      $("cOwner").value = cfg.owner; $("cRepo").value = cfg.repo; $("cToken").placeholder = "入力済み（変えるときだけ入れる）";
      delete $("pHint").dataset.msg; passUi(); passMsg("設定できました。");
      return sync();
    }, function(e){
      passMsg(e.message === "nokey" ? "まだ合言葉が登録されていません。設定済みの端末で登録してください。" : e.message === "badpass" ? "合言葉が違います。" : "復元できませんでした（" + e.message + "）");
    });
  }
  job.then(function(){ $("cPassBtn").disabled = false; passUi(); });
};
passUi();

/* ---------- 起動 ---------- */
var draft = LS.get("im_draft", null);
resetForm();
if (draft && (draft.text || draft.comment)) LS.set("im_draft", draft);
if (draft){ $("fText").value = draft.text || ""; $("fComment").value = draft.comment || ""; }
render();
if (!cfg.token) showTab("set");
sync();
setInterval(function(){ if (!document.hidden && !recOn) sync(true); }, 60000);
showRec();
document.addEventListener("visibilitychange", function(){ if (!document.hidden) sync(true); });
window.addEventListener("online", function(){ sync(true); });
})();
</script>
